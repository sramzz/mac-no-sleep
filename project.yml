name: PreventSleep
options:
  bundleIdPrefix: com.sramzz
  deploymentTarget:
    macOS: "26.0"

settings:
  MACOSX_DEPLOYMENT_TARGET: "26.0"
  SWIFT_VERSION: "6.0"
  CODE_SIGN_IDENTITY: "-"
  CODE_SIGN_STYLE: Manual

targets:
  PreventSleepCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/PreventSleepCore

  PreventSleepHelper:
    type: tool
    platform: macOS
    sources:
      - path: Sources/PreventSleepHelper
        excludes:
          - "**/*.plist"
          - "Resources/**"
    dependencies:
      - target: PreventSleepCore
    settings:
      PRODUCT_NAME: com.sramzz.mac-no-sleep.helper
      PRODUCT_BUNDLE_IDENTIFIER: com.sramzz.mac-no-sleep.helper
      CODE_SIGN_ENTITLEMENTS: Sources/PreventSleepHelper/Resources/PreventSleepHelper.entitlements

  PreventSleep:
    type: application
    platform: macOS
    sources:
      - path: Sources/PreventSleepApp
        excludes:
          - "Resources/**"
    dependencies:
      - target: PreventSleepCore
      - target: PreventSleepHelper
        embed: false
    info:
      path: Sources/PreventSleepApp/Resources/Info.plist
    settings:
      PRODUCT_NAME: PreventSleep
      PRODUCT_BUNDLE_IDENTIFIER: com.sramzz.mac-no-sleep
      CODE_SIGN_ENTITLEMENTS: Sources/PreventSleepApp/Resources/PreventSleep.entitlements
    postBuildScripts:
      - name: Embed Helper and Daemon Plist
        script: |
          DEST_DAEMONS="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchDaemons"
          DEST_MACOS="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/MacOS"
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning 2>/dev/null | grep "Apple Development" | head -n 1 | awk -F'"' '{print $2}' || true)
          if [ -z "$SIGNING_IDENTITY" ]; then
              SIGNING_IDENTITY="-"
          fi
          mkdir -p "$DEST_DAEMONS"
          mkdir -p "$DEST_MACOS"
          rm -f "$DEST_DAEMONS/com.sramzz.mac-no-sleep.helper"
          cp "$BUILT_PRODUCTS_DIR/com.sramzz.mac-no-sleep.helper" "$DEST_MACOS/"
          cp "$SRCROOT/Sources/PreventSleepHelper/com.sramzz.mac-no-sleep.helper.plist" "$DEST_DAEMONS/"
          codesign -s "$SIGNING_IDENTITY" -o runtime --force -i "com.sramzz.mac-no-sleep.helper" "$DEST_MACOS/com.sramzz.mac-no-sleep.helper"
          find "$DEST_MACOS" -name "*.dylib" -exec codesign -s "$SIGNING_IDENTITY" -o runtime --force {} + 2>/dev/null || true

  PreventSleepTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/PreventSleepCoreTests
    dependencies:
      - target: PreventSleepCore
      - target: PreventSleepHelper
