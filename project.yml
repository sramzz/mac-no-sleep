name: PreventSleep
options:
  bundleIdPrefix: com.preventsleep
  deploymentTarget:
    macOS: "26.0"

settings:
  MACOSX_DEPLOYMENT_TARGET: "26.0"
  SWIFT_VERSION: "6.0"
  MARKETING_VERSION: "1.0.1"
  CURRENT_PROJECT_VERSION: "101"
  ARCHS: "arm64"
  ONLY_ACTIVE_ARCH: NO
  CODE_SIGN_IDENTITY: "-"
  CODE_SIGN_STYLE: Manual

targets:
  PreventSleepCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/PreventSleepCore

  PreventSleepHelper:
    type: tool
    platform: macOS
    sources:
      - path: Sources/PreventSleepHelper
        excludes:
          - "**/*.plist"
          - "Resources/**"
    dependencies:
      - target: PreventSleepCore
    settings:
      PRODUCT_NAME: com.preventsleep.helper
      PRODUCT_BUNDLE_IDENTIFIER: com.preventsleep.helper
      MARKETING_VERSION: "1.0.1"
      CURRENT_PROJECT_VERSION: "101"
      CODE_SIGN_ENTITLEMENTS: Sources/PreventSleepHelper/Resources/PreventSleepHelper.entitlements

  PreventSleep:
    type: application
    platform: macOS
    sources:
      - path: Sources/PreventSleepApp
        excludes:
          - "Resources/Info.plist"
          - "Resources/PreventSleep.entitlements"
    dependencies:
      - target: PreventSleepCore
      - target: PreventSleepHelper
        embed: false
    info:
      path: Sources/PreventSleepApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: "Prevent Sleep"
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "101"
        LSApplicationCategoryType: "public.app-category.utilities"
        NSHumanReadableCopyright: "Copyright © 2026 Santiago Ramirez. All rights reserved."
        LSUIElement: true
        CFBundleIconFile: "AppIcon"
        CFBundleIconName: "AppIcon"
    settings:
      PRODUCT_NAME: PreventSleep
      PRODUCT_BUNDLE_IDENTIFIER: com.preventsleep.app
      MARKETING_VERSION: "1.0.1"
      CURRENT_PROJECT_VERSION: "101"
      CODE_SIGN_ENTITLEMENTS: Sources/PreventSleepApp/Resources/PreventSleep.entitlements
      INFOPLIST_KEY_LSUIElement: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      - name: Embed Helper and Daemon Plist
        script: |
          DEST_DAEMONS="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchDaemons"
          DEST_MACOS="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/MacOS"
          SIGNING_IDENTITY="${CODE_SIGN_IDENTITY_OVERRIDE:-}"
          if [ -z "$SIGNING_IDENTITY" ]; then
              SIGNING_IDENTITY=$(security find-identity -v -p codesigning 2>/dev/null | grep "Apple Development" | head -n 1 | awk -F'"' '{print $2}' || true)
          fi
          if [ -z "$SIGNING_IDENTITY" ]; then
              SIGNING_IDENTITY="-"
          fi
          mkdir -p "$DEST_DAEMONS"
          mkdir -p "$DEST_MACOS"
          rm -f "$DEST_DAEMONS/com.preventsleep.helper"
          cp "$BUILT_PRODUCTS_DIR/com.preventsleep.helper" "$DEST_MACOS/"
          cp "$SRCROOT/Sources/PreventSleepHelper/com.preventsleep.helper.plist" "$DEST_DAEMONS/"
          codesign -s "$SIGNING_IDENTITY" -o runtime --force -i "com.preventsleep.helper" "$DEST_MACOS/com.preventsleep.helper"
          find "$DEST_MACOS" -name "*.dylib" -exec codesign -s "$SIGNING_IDENTITY" -o runtime --force {} + 2>/dev/null || true

  PreventSleepTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/PreventSleepCoreTests
    dependencies:
      - target: PreventSleepCore
      - target: PreventSleepHelper
